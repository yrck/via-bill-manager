# Invitation tokens live in URL paths; omit paths, queries and referrers from logs.
log_format via_safe '$time_iso8601 $request_method $status $body_bytes_sent';
resolver 127.0.0.11 valid=10s;
upstream via_php {
    zone via_php 64k;
    server app:9000 resolve;
}
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 12m;
    access_log /var/log/nginx/access.log via_safe;
    # The deployed entry point is the authenticated workspace, not the local demo.
    location = / { return 302 /workspace; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/index\.php(/|$) {
        fastcgi_pass via_php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
